name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── gate ───────────────────────────────────────────────────────────────────
  # Format, analyse, test. Fast, cached, no network beyond the package feed.
  # This is the job a contributor sees fail first, so it says what to run.
  gate:
    name: format, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Distillate.sln

      # Enforced as a gate rather than a habit: a formatting change is a review
      # comment, a build failure is not. `dotnet format` exits non-zero and names
      # the files, so the fix is `dotnet format Distillate.sln` locally.
      - name: Format
        run: dotnet format Distillate.sln --verify-no-changes --no-restore

      # Warnings are errors via Directory.Build.props; -warnaserror makes that
      # true for the compiler too, including warnings emitted during build.
      - name: Build
        run: dotnet build Distillate.sln -c Release --no-restore -warnaserror

      # The integration tests drive a real Chromium through Playwright. CI has no
      # system browser, so it uses the one Playwright downloads — which is also
      # the fallback path a deployment takes when CHROMIUM_PATH does not resolve.
      - name: Install Chromium for tests
        run: |
          pwsh tests/Distillate.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test Distillate.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"
          if-no-files-found: ignore
          retention-days: 7

  # ── container ──────────────────────────────────────────────────────────────
  # Builds the real image and runs it the way the README says to. This is the
  # only job that can catch a default environment variable that stops the process
  # from starting, a missing runtime dependency, or a health probe that returns
  # 200 for the wrong reason.
  container:
    name: build and probe image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: distillate:ci
          # The same stamp the release build uses, so a failure here is a failure
          # of the thing that ships.
          build-args: |
            DISTILLATE_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Started with no environment variables at all: whatever the Dockerfile
      # defaults are, are what a stranger gets on their first run.
      - name: Start with defaults
        run: |
          set -euo pipefail
          docker run -d --name distillate-ci --network host distillate:ci

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "health endpoint never answered" >&2
              docker logs distillate-ci >&2
              exit 1
            fi
            sleep 1
          done

          cat /tmp/health.json

      # Status codes are not evidence. Assert a marker from the body, so a 200
      # from something else on the port cannot pass this job.
      - name: Assert the health body is ours
        run: |
          set -euo pipefail
          grep -q '"status":"healthy"' /tmp/health.json
          grep -q '"version":"0\.1\.0"' /tmp/health.json
          grep -q "\"build\":\"${GITHUB_SHA}\"" /tmp/health.json

      - name: Probe from inside the image
        run: docker exec distillate-ci dotnet Distillate.Web.dll --healthcheck

      # One real extraction, against a page served on the runner. This is the
      # path the unit tests cannot take: request -> Kestrel -> Playwright ->
      # system Chromium -> SmartReader -> markdown, inside the shipped image.
      - name: Extract a page end to end
        run: |
          set -euo pipefail
          python3 -m http.server 8099 --bind 127.0.0.1 --directory tests/fixtures &
          server=$!
          trap 'kill $server' EXIT
          sleep 2

          response=$(curl -fsS -X POST http://127.0.0.1:8080/process \
            -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1:8099/article.html","stabilizationMs":0}')

          echo "$response"
          echo "$response" | grep -q '"success":true'
          echo "$response" | grep -q 'pipeline from HTTP request to'
          echo "$response" | grep -q '"markdownNoImages"'

      # A container that exits on its own is a container that failed to start.
      - name: Still running
        run: |
          set -euo pipefail
          running=$(docker inspect --format '{{.State.Running}}' distillate-ci)
          [ "$running" = "true" ] || { docker logs distillate-ci; exit 1; }

      - name: Logs
        if: always()
        run: docker logs distillate-ci

      - name: Inspect healthcheck
        run: docker inspect --format '{{json .Config.Healthcheck}}' distillate:ci
