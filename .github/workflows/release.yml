name: release

on:
  # Every push to main publishes an image, so there is always something current
  # to pull onto a box and try. A tag publishes a stable version on top of it.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase on purpose: a container image path may not contain capitals, and
  # the repository is called Distillate.
  IMAGE_NAME: hyper-dragon/distillate

jobs:
  # ── prepare ────────────────────────────────────────────────────────────────
  # Which architectures are available is a property of the repository's
  # visibility, not of this file: GitHub's arm64 hosted runners (`ubuntu-24.04-arm`)
  # are free for public repositories and billable for private ones. Rather than a
  # release workflow that cannot start while the repository is private, the matrix
  # is computed here and the arm64 leg simply joins the build once the repository
  # is public. Re-running this workflow on an existing tag afterwards republishes
  # the same tag as a true multi-arch manifest.
  prepare:
    name: plan architectures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          set -euo pipefail
          amd64='{"platform":"linux/amd64","runner":"ubuntu-latest","arch":"amd64"}'
          arm64='{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}'

          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "repository is private: building linux/amd64 only" >&2
            echo "matrix={\"include\":[$amd64]}" >> "$GITHUB_OUTPUT"
          else
            echo "repository is public: building linux/amd64 and linux/arm64" >&2
            echo "matrix={\"include\":[$amd64,$arm64]}" >> "$GITHUB_OUTPUT"
          fi

  # ── build ──────────────────────────────────────────────────────────────────
  # One job per architecture, each on a runner of that architecture, each pushing
  # a single-arch image *by digest*. Nothing is tagged here — see the merge job.
  #
  # Why a matrix rather than one build with `platforms: linux/amd64,linux/arm64`:
  # the second platform would be emulated under QEMU, and a cross-built image is
  # slow to produce and never executed on the machine that built it.
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only: the tags this would produce are deliberately unused, because
      # a tag on a one-architecture image is a lie the merge job later fixes.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Compiled into the assembly, so /health and the startup log name the
          # commit rather than just the version.
          build-args: |
            DISTILLATE_BUILD=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          # A cache scope per architecture; one shared scope has the two jobs
          # evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── merge ──────────────────────────────────────────────────────────────────
  # Puts the two digests behind one manifest list and labels it. This is the only
  # job that knows the tags, so `docker pull` gets an image that really is both
  # architectures rather than whichever built last.
  merge:
    name: publish multi-arch image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # Write, because a tag also publishes a release page with the changelog
      # section for that version.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # A tag publishes a page as well as an image. The notes come from the
      # changelog section for that version — a release page generated from commit
      # subjects says nothing, and on a squashed history says nothing at all.
      - name: Publish release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "no changelog section for $version; falling back to generated notes"
            gh release create "$tag" --title "Distillate $version" --generate-notes
          else
            printf 'What changed in %s.\n\n%s\n\nThe image is `%s:%s`; the platforms it contains are listed by `docker buildx imagetools inspect` on the workflow run.\n' \
              "$version" "$notes" "$REGISTRY/$IMAGE_NAME" "$version" > /tmp/notes.md
            gh release create "$tag" --title "Distillate $version" --notes-file /tmp/notes.md
          fi
