version: '3.8'

# Optimized configuration for Raspberry Pi (4/5 with 8GB RAM)
# Increase swap to ~2GB on the host for best results:
#   sudo dphys-swapfile swapoff
#   sudo nano /etc/dphys-swapfile  # Set CONF_SWAPSIZE=2048
#   sudo dphys-swapfile setup
#   sudo dphys-swapfile swapon

services:
  distillate:
    image: distillate-web:release
    container_name: distillate-pi
    ports:
      - "8080:8080"
    environment:
      # Conservative concurrency for stability
      - CONCURRENCY=1
      # 3 minute timeout
      - MAX_TIME_MS=180000
      # 200MB image budget
      - MAX_IMAGE_BYTES=209715200
      # Aggressive GC for memory recovery
      - GC_MODE=aggressive
      # 10 second stabilization
      - STABILIZATION_MS=10000
      - LOG_LEVEL=Information
      - PORT=8080
      - CHROMIUM_PATH=/usr/bin/chromium
      # Pi-specific Chromium optimizations
      - CHROMIUM_ARGS=--single-process --disable-features=TranslateUI --disable-background-networking
      # Limit V8 heap to prevent OOM
      - MAX_V8_HEAP_SIZE_MB=256
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Reduce OOM kill priority
    oom_score_adj: -100
